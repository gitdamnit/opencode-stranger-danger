# Manual release publishing using npm Trusted Publishing (OIDC).
# Never triggered by a GitHub release or tag push.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input and checkout tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Expected a stable release tag such as v1.2.3" >&2
            exit 1
          fi
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Node for npm Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require current npm OIDC client
        run: npm install --global 'npm@^11.5.1'

      - name: Verify version and tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          actual="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$actual" || {
            echo "Version mismatch: $RELEASE_TAG vs $actual" >&2
            exit 1
          }
          echo "Verified release $RELEASE_TAG"

      - name: Install dependencies
        run: npm ci
      - name: Build and validate
        run: |
          npm run build
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run test:integration
          npm run test:security
          npm run verify:package

      - name: Publish using OIDC
        run: npm publish --access public
